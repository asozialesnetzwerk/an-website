name: an-website
services:
  an-website:
    image: ghcr.io/asozialesnetzwerk/an-website:dev
    build:
      dockerfile: Containerfile
      context: .
    command:
      - --redis-port=6379
      - --redis-host=redis
      - --unix-socket-path=/run
    restart: always
    volumes:
      - .:/data
      - sockets:/run
    depends_on:
      - redis
    networks:
      default: {}
      redis: {}

  static-files:
    image: ghcr.io/asozialesnetzwerk/an-website-static-files:dev
    build:
      dockerfile: static-files.Containerfile
      context: .
      depends_on:
        - an-website
      args:
          AN_WEBSITE: ghcr.io/asozialesnetzwerk/an-website:dev
    restart: always
    networks: {}
    volumes:
      - sockets:/run

  redis:
    image: ghcr.io/asozialesnetzwerk/redis-cell:nightly-alpine
    volumes:
      - redis-data:/data
    networks:
      redis: {}

  nginx:
    build:
      no_cache: true
      dockerfile: ./example-configurations/nginx.Containerfile
    ports:
      - 1610:1610
    depends_on:
      - an-website
      - static-files
    volumes:
      - sockets:/run

volumes:
  redis-data: {}
  sockets: {}

networks:
  default: {}
  redis:
    internal: true
